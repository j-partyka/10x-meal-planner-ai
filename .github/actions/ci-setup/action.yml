# Composite action: checkout, setup Node from .nvmrc, install dependencies with npm ci.
# Use in PR and CI workflows to avoid repeating these steps.
name: "CI setup"
description: "Checkout repo, setup Node from .nvmrc, run npm ci"
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: ".nvmrc"
        cache: "npm"

    - name: Install dependencies
      run: npm ci
      shell: bash
