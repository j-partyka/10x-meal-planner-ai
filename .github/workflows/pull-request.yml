# Pull Request: lint → unit-test + e2e-test (parallel) → status-comment when all pass.
# Uses integration environment and secrets for E2E; collects unit and E2E artifacts.
name: Pull Request
on:
  pull_request:
    branches: [main, master]
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npm run lint

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: ./.github/actions/ci-setup
      - name: Run unit tests with coverage
        run: npm run test:coverage
      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7

  e2e-test:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [lint]
    environment: integration
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: ./.github/actions/ci-setup
      - name: Create .env.test from secrets
        run: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_KEY=$SUPABASE_KEY"
            echo "PUBLIC_SUPABASE_URL=$PUBLIC_SUPABASE_URL"
            echo "PUBLIC_SUPABASE_ANON_KEY=$PUBLIC_SUPABASE_ANON_KEY"
            echo "E2E_USERNAME=$E2E_USERNAME"
            echo "E2E_PASSWORD=$E2E_PASSWORD"
            echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY"
          } > .env.test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  status-comment:
    name: PR status comment
    runs-on: ubuntu-latest
    needs: [lint, unit-test, e2e-test]
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR status
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-workflow-status -->';
            const body = `## Pull Request checks – all passed ${marker}

            | Job | Status |
            |-----|--------|
            | Lint | ✅ Passed |
            | Unit tests (coverage) | ✅ Passed |
            | E2E tests | ✅ Passed |

            **Artifacts:** Unit coverage and Playwright report are available in the workflow run.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
