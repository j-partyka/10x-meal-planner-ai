# Pull Request: lint → unit-test → status-comment when all pass.
# Collects unit coverage artifact.
name: Pull Request
on:
  pull_request:
    branches: [main, master]
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npm run lint

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: ./.github/actions/ci-setup
      - name: Run unit tests with coverage
        run: npm run test:coverage
      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7

  status-comment:
    name: PR status comment
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR status
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-workflow-status -->';
            const body = `## Pull Request checks – all passed ${marker}

            | Job | Status |
            |-----|--------|
            | Lint | ✅ Passed |
            | Unit tests (coverage) | ✅ Passed |

            **Artifacts:** Unit coverage is available in the workflow run.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
